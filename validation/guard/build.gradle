plugins { id 'com.android.application' }
android {
  namespace 'dev.antishake.guard'
  compileSdk 35
  defaultConfig {
    applicationId 'dev.antishake.guard'
    minSdk 26
    targetSdk 35
    versionCode 2
    versionName '0.2-validation'
    // This small module needs one DEX; avoid parallel DEX loading during specialization.
    multiDexEnabled false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      def testHome = layout.buildDirectory.dir('robolectric-home').get().asFile
      systemProperty 'user.home', testHome.absolutePath
      systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
      doFirst { testHome.mkdirs() }
    }
  }
}
dependencies {
  implementation project(':policy')
  compileOnly files('../../app/libs/de.robv.android.xposed-api-82.jar')
  testImplementation files('../../app/libs/de.robv.android.xposed-api-82.jar')
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.14.1'
}
