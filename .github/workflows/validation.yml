name: Validation (baseline and embedded Xposed)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Test lifecycle evidence checks and timeout preservation
        run: python3 -m unittest discover -s validation/scripts -p 'test_*.py'
      - name: Tests, Lint and debug APKs
        working-directory: validation
        run: >-
          ./gradlew --no-daemon :policy:test :guard:testDebugUnitTest
          :fixture:testProtectedAppDebugUnitTest :fixture:testControlDebugUnitTest
          :guard:assembleDebug :fixture:assembleDebug
          :guard:lintDebug :fixture:lintProtectedAppDebug :fixture:lintControlDebug
      - name: Check actual module is single DEX
        run: python3 validation/scripts/check-module-dex.py validation/guard/build/outputs/apk/debug/guard-debug.apk
      - name: Release disposable build cache before emulator
        working-directory: validation
        run: |
          ./gradlew --stop
          du -sh /home/runner/.gradle/caches
          rm -rf -- /home/runner/.gradle/caches
          df -h .
      - name: Allow runner access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Java 21 for pinned LSPatch CLI
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Baseline, embedded Xposed and restoration
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_EMULATOR_FEATURES: -VirtioVsockPipe
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          ram-size: 2048M
          emulator-boot-timeout: 300
          script: python3 validation/scripts/ci-embedded-test.py
      - name: Keep debug APKs and validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.sha }}
          retention-days: 7
          path: |
            validation/guard/build/outputs/apk/debug/*.apk
            validation/fixture/build/outputs/apk/*/debug/*.apk
            validation/**/build/test-results/**/*.xml
            validation/**/build/reports/lint-results-*.txt
            validation/build/device-evidence/*
