name: Validation (baseline and embedded Xposed)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install build SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Tests, Lint and debug APKs
        working-directory: validation
        run: >-
          ./gradlew --no-daemon :policy:test :guard:testDebugUnitTest
          :fixture:testProtectedAppDebugUnitTest :fixture:testControlDebugUnitTest
          :guard:assembleDebug :fixture:assembleDebug
          :guard:lintDebug :fixture:lintProtectedAppDebug :fixture:lintControlDebug
      - name: Allow runner access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Java 21 for pinned LSPatch CLI
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Baseline, embedded Xposed and restoration
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          script: |
            bash validation/scripts/ci-baseline.sh
            bash validation/scripts/ci-lspatch.sh
      - name: Keep private build artifacts and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-${{ github.sha }}
          retention-days: 7
          path: |
            validation/guard/build/outputs/apk/debug/*.apk
            validation/fixture/build/outputs/apk/*/debug/*.apk
            validation/**/build/test-results/**/*.xml
            validation/**/build/reports/lint-results-*.txt
            validation/build/device-evidence/*
