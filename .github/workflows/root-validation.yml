name: Root Vector validation (disposable emulator only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: root-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  root-vector:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        trial: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Build unchanged module and fixtures
        working-directory: validation
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
          ./gradlew --no-daemon :guard:assembleDebug :fixture:assembleDebug
      - name: Check timeout evidence preservation
        run: python3 validation/scripts/test_root_evidence.py
      - name: Allow isolated runner KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Prepare patched ramdisk using official Magisk tooling
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          ram-size: 2048M
          emulator-boot-timeout: 300
          script: bash validation/scripts/ci-root-prepare.sh
      - name: Root scope, reboot and disable behavior
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -feature -SystemAsRoot -ramdisk ${{ github.workspace }}/validation/build/root/ramdisk.img
          script: python3 validation/scripts/ci-root-test.py
      - name: Keep evidence only, no framework APKs or disk images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-validation-${{ github.sha }}-trial-${{ matrix.trial }}
          retention-days: 7
          path: validation/build/root-evidence/*
